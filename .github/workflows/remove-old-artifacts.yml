name: 删除旧工件和缓存

# 最小权限（2026-11-13）：
#   · 删 caches 用 secrets.GITHUB_TOKEN → 需要 actions: write
#   · 删 workflow runs 用的是 secrets.RELEASES_TOKEN，不占这里的权限
permissions:
  actions: write
  contents: read

# 并发控制：这个工作流几秒就跑完，连点意义不大，排队避免同时删同一批缓存
concurrency:
  group: remove-old-artifacts
  cancel-in-progress: false

on:
  repository_dispatch:
  workflow_dispatch:

env:
  DELETE_ARTIFACTS: true  # 删除旧的工作流程运行和工件
  DELETE_CACHE: true      # 删除缓存
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  remove-old-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 3600

    name: 删除旧工件和缓存
    strategy:
      fail-fast: false

    steps:
    - name: 删除旧的工作流程运行和工件
      # 钉 SHA（2026-11-13）：main 分支 2026-06-05 提交。
      uses: Mattraks/delete-workflow-runs@0cf693bc9909e5e867ee8f27b813224ba862939c
      if: env.DELETE_ARTIFACTS == 'true'
      with:
        token: ${{ secrets.RELEASES_TOKEN }}    # 令牌
        repository: ${{ github.repository }}    # 运行工作流的存储库的名称
        retain_days: 1                          # 工作流的保留天数
        keep_minimum_runs: 0                    # 工作流程保留的最少运行次数

    - name: 列出缓存并删除
      if: env.DELETE_CACHE == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # 列出所有缓存 ID
        cache_ids=$(gh api /repos/${{ github.repository }}/actions/caches --jq '.actions_caches[].id')

        # 循环删除每个缓存
        for cache_id in $cache_ids; do
          echo "Deleting cache with ID: $cache_id"
          gh api -X DELETE /repos/${{ github.repository }}/actions/caches/$cache_id
        done
