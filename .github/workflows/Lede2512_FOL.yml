#
# 编译 Lede-2512 固件（Flippy 打包用 rootfs）
# 2026.10.16 改造：
#   1) 双设备矩阵：Phicomm N1 (s905d) / X96 Max+ (s905x3)，各自使用不同的
#      CONFIG_TARGET_OPTIMIZATION，分别发布到 Build2512-N1 / Build2512-X96 标签。
#   2) 编译前自选插件：由 aarch64/Lede2512/plugins.cfg 控制（on/off），
#      gen_config.py 负责合成最终 .config、自动补齐缺失条目、按需改写优化参数。
#   3) 第三方插件：由 aarch64/Lede2512/thirdparty.cfg 控制。
# 原始版本备份：Lede2512_FOL.yml.bak-*
#
name: 编译Lede2512_FOL

# 最小权限（2026-11-13）：
#   本工作流唯一需要写权限的地方是 ncipollo/release-action 上传 rootfs 到
#   Build2512-N1 / Build2512-X96 两个 prerelease 标签 → contents: write。
#   upload-artifact 用的是运行时 token，不需要 GITHUB_TOKEN 权限。
#   不写这段时 GITHUB_TOKEN 会继承仓库默认（可能含更多权限），显式收窄。
permissions:
  contents: write

# 并发控制（2026-11-13）：
#   编译耗时 4h+，中途连点两次会让两个 run 同时写同一个 Build2512-* 标签，
#   后完成的覆盖先完成的，日志上看不出来。这里排队而不取消：
#   cancel-in-progress: true 会把跑到一半的编译直接杀掉，浪费更大。
concurrency:
  group: lede2512-build-${{ github.ref }}
  cancel-in-progress: false

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      device:
        description: '要编译哪个设备的固件'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - n1
          - x96
# 定时触发开始编译(把下面两个#去掉开启,时间设置请看定时编译说明)
#  schedule:
#   - cron: 0 16 */2 * *

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  FEEDS_CONF: aarch64/Lede2512/feeds.conf.default
  # 基线 config（目标平台 / 系统 / 内核 / 基础包），插件开关不在这里，在 PLUGINS_CFG
  BASE_CONFIG: aarch64/Lede2512/Lede2512_FOL.config
  # 插件清单：改这个文件就能增减插件
  PLUGINS_CFG: aarch64/Lede2512/plugins.cfg
  # 第三方插件清单 + 开关
  THIRDPARTY_CFG: aarch64/Lede2512/thirdparty.cfg
  GEN_CONFIG: aarch64/scripts/gen_config.py
  # 插件清单校验白名单（2026-11-13）：
  #   make defconfig 之后，plugins.cfg 里标 on 却最终没启用的项，
  #   只要不在这里列出来，就中止编译 —— 10 秒换 4 小时。
  VERIFY_IGNORE: aarch64/Lede2512/verify-ignore.txt
  DIY_P1_SH: aarch64/Lede2512/2512diy-part1.sh
  DIY_P2_SH: aarch64/Lede2512/2512diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  # ==========================================================================
  #  准备：按运行界面选择，生成编译矩阵
  # ==========================================================================
  prepare:
    runs-on: ubuntu-22.04
    name: 准备编译矩阵
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
    - name: 准备
      uses: actions/checkout@v4

    - name: 生成矩阵（设备参数以 gen_config.py 为准，不在这里重复维护）
      id: matrix
      env:
        DEV: ${{ github.event.inputs.device }}
      run: |
        case "$DEV" in
          n1)  SEL="n1"  ; TXT="仅 Phicomm N1 (s905d)" ;;
          x96) SEL="x96" ; TXT="仅 X96 Max+ (s905x3)" ;;
          *)   SEL="all" ; TXT="两个设备都编译" ;;
        esac
        M="$(python3 "$GEN_CONFIG" --list-devices --only "$SEL" --build-prefix Build2512 --lede-prefix Lede2512)"
        if [ -z "$M" ]; then echo "!! 生成编译矩阵失败"; exit 1; fi
        echo "matrix=$M" >> "$GITHUB_OUTPUT"
        {
          echo "### 编译矩阵已生成"
          echo ""
          echo "- 选择：$TXT"
          echo "- 插件清单：\`$PLUGINS_CFG\`"
          echo "- 第三方清单：\`$THIRDPARTY_CFG\`"
          echo ""
          echo '```json'
          echo "$M"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        echo "matrix = $M"

  # ==========================================================================
  #  编译
  # ==========================================================================
  build:
    needs: prepare
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    name: 编译Lede2512 · ${{ matrix.label }}

    steps:
    - name: 准备
      uses: actions/checkout@v4

    - name: 解析设备参数
      run: |
        echo "DEVICE=${{ matrix.device }}" >> $GITHUB_ENV
        echo "DEVICE_LABEL=${{ matrix.label }}" >> $GITHUB_ENV
        echo "FILE_NAME=${{ matrix.tag }}" >> $GITHUB_ENV
        echo "DEVICE_OPT=${{ matrix.opt }}" >> $GITHUB_ENV
        echo "AML_TAG_KEYWORD=${{ matrix.aml }}" >> $GITHUB_ENV
        {
          echo "### 本次编译目标"
          echo ""
          echo "| 项 | 值 |"
          echo "| --- | --- |"
          echo "| 设备 | ${{ matrix.label }} |"
          echo "| 发布标签 | ${{ matrix.tag }} |"
          echo "| 编译参数 | \`CONFIG_TARGET_OPTIMIZATION=${{ matrix.opt }}\` |"
          echo "| 晶晨宝盒关键字 | ${{ matrix.aml }} |"
        } >> "$GITHUB_STEP_SUMMARY"
        echo "设备=${{ matrix.label }}  优化参数=[${{ matrix.opt }}]"

    - name: 部署编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        #docker rmi $(docker images -q) || true
        docker images -q | xargs -r docker rmi || true
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /etc/mysql /etc/php
        sudo -E apt-get -y purge azure-cli* docker* ghc* zulu* hhvm* llvm* firefox* google* dotnet* aspnetcore* powershell* openjdk* adoptopenjdk* mysql* php* mongodb* moby* snap* || true
        sudo -E apt-get -qq update
        #sudo -E apt -y install $(curl -fsSL https://tinyurl.com/ubuntu2204-make-openwrt) subversion clang llvm
        #sudo -E apt-get -qq install libfuse-dev $(curl -fsSL https://tinyurl.com/ubuntu2204-make-openwrt)
        sudo -E apt-get -qq install $(cat $GITHUB_WORKSPACE/depends-ubuntu-2204) cython3 python3-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        #sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir
        echo "status=success" >> $GITHUB_OUTPUT
        df -Th

    - name: 创建模拟物理磁盘
      run: |
        mnt_size=$(expr $(df -h /mnt | tail -1 | awk '{print $4}' | sed 's/[[:alpha:]]//g' | sed 's/\..*//') - 1)
        root_size=$(expr $(df -h / | tail -1 | awk '{print $4}' | sed 's/[[:alpha:]]//g' | sed 's/\..*//') - 4)
        sudo truncate -s "${mnt_size}"G /mnt/mnt.img
        sudo truncate -s "${root_size}"G /root.img
        sudo losetup /dev/loop6 /mnt/mnt.img
        sudo losetup /dev/loop7 /root.img
        sudo pvcreate /dev/loop6
        sudo pvcreate /dev/loop7
        sudo vgcreate github /dev/loop6 /dev/loop7
        sudo lvcreate -n runner -l 100%FREE github
        sudo mkfs.xfs /dev/github/runner
        sudo mkdir -p /workdir
        sudo mount /dev/github/runner /workdir
        sudo chown -R runner.runner /workdir
        df -Th

    - name: 检查服务器性能
      run: |
        echo "警告⚠"
        echo "若分配的服务器性能不足，务必及时取消，重新运行！"
        echo "已知编译成功CPU型号：8370C,8171M"
        echo "已知性能不足CPU型号：8272CL"
        echo -e "-------------- ------------CPU信息------------------------------------------\n"
        echo "CPU物理数量:$(cat /proc/cpuinfo| grep "physical id"| sort| uniq| wc -l)"
        echo -e "CPU核心及版本信息：$(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c) \n"
        echo "-------------------------------内存信息-------------------------------------------"
        echo "已安装内存详细信息："
        sudo lshw -short -C memory | grep GiB
        echo -e "\n"
        echo "-----------------------------硬盘信息---------------------------------------------"
        echo -e  "硬盘数量：$(ls /dev/sd* | grep -v [1-9] | wc -l) \n"
        echo "硬盘详情："
        df -Th

    - name: 下载源码
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
        cd openwrt
        useVersionInfo=$(git show -s --date=short --format="Author: %an<br/>date: %cd<br/>commit: %s<br/>commit hash: %H")
        echo "useVersionInfo=$useVersionInfo" >> $GITHUB_ENV
        echo "DATE=$(date "+%Y-%m-%d %H:%M:%S")" >> $GITHUB_ENV
        echo "DATE1=$(date "+%Y-%m-%d")" >> $GITHUB_ENV

    # 缓存按设备分开，避免两种编译参数互相污染
    # 钉 SHA（2026-11-13）：原来跟 @main，上游一改就影响构建且无法审计。
    #   对应 stupidloud/cachewrtbuild 的 main 分支 2026-05-10 提交。
    #   升级办法：查 /repos/stupidloud/cachewrtbuild/commits/main 的 sha，替换此处。
    - name: 缓存加速
      uses: stupidloud/cachewrtbuild@b729f807837dbc3455d02fd35192660d9b662121
      with:
        mixkey: '${{ matrix.tag }}'
        ccache: true
        skip: false
        toolchain: true
        clean: false
        prefix: ${{ github.workspace }}/openwrt

    - name: 加载自定义配置
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: 更新软件包
      run: cd openwrt && ./scripts/feeds update -a

    - name: 安装软件包
      run: cd openwrt && ./scripts/feeds install -a

    # ----------------------------------------------------------------------
    #  生成 .config：基线 config + plugins.cfg + 本设备编译参数
    # ----------------------------------------------------------------------
    - name: 生成 .config（插件清单 + 设备参数）
      run: |
        [ -e files ] && mv files openwrt/files || true
        cd openwrt
        python3 "$GITHUB_WORKSPACE/$GEN_CONFIG" \
          --base "$GITHUB_WORKSPACE/$BASE_CONFIG" \
          --plugins "$GITHUB_WORKSPACE/$PLUGINS_CFG" \
          --device "${{ matrix.device }}" \
          --out .config \
          --report "$GITHUB_WORKSPACE/config-report-${{ matrix.device }}.txt"
        echo "---------- .config 关键项 ----------"
        grep -E '^CONFIG_TARGET_(BOARD|SUBTARGET|PROFILE|OPTIONS|OPTIMIZATION)' .config || true
        grep -c '^CONFIG_PACKAGE_.*=y$' .config | sed 's/^/启用的 PACKAGE 数量：/'

    - name: 执行 DIY 脚本 part2（克隆第三方插件）
      run: |
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: 下载软件包
      id: package
      # 下载失败不阻塞整个 job：缺包会在编译阶段按需重下。
      continue-on-error: true
      run: |
        cd openwrt
        make defconfig
        echo ""
        # 插件清单校验已移到下一步的独立 step（严格模式，失败即中止）。
        # 本 step 带 continue-on-error: true，校验放在这里拦不住任何东西。
        echo ""
        # ------------------------------------------------------------------
        # 下载限时保护（2026.11.06）
        #   make download -j8 在含大量 git / svn 协议包的配置下，会因多个线程
        #   抢 dl 目录锁而挂起：不报错、不再输出、进度归零，一路拖到 Actions
        #   单 job 的 6 小时上限被系统强杀（run #21 实测 361.5 分钟，卡在本步）。
        #   对策：两轮下载各设硬上限（60 + 40 分钟），超时就降级，最坏 100 分钟；
        #   仍未下完的包交给编译阶段按需重下，不再阻塞整个 job。
        # ------------------------------------------------------------------
        set +e
        timeout 60m make download -j8 -k
        rc=$?
        if [ $rc -ne 0 ]; then
          echo "::warning::并行下载未在 60 分钟内结束（rc=$rc），改用单线程补齐"
          pkill -f 'make.*download' || true
          sleep 3
          timeout 40m make download -j1 -k
          rc=$?
        fi
        if [ $rc -ne 0 ]; then
          echo "::warning::仍有包未下载完成（rc=$rc）。缺包会在编译阶段按需重下。"
          echo "---------- dl 目录最近变化的 8 项（供下次定位卡点） ----------"
          ls -lt dl 2>/dev/null | head -9 || true
        fi
        set -e
        find dl -size -1024c -exec ls -l {} \; || true
        find dl -size -1024c -exec rm -f {} \; || true
        rm -rf $GITHUB_WORKSPACE/.git
        rm -rf $GITHUB_WORKSPACE/opt
        df -Th

    # ----------------------------------------------------------------------
    #  严格校验插件清单（2026-11-13）
    #    make defconfig 之后，Kconfig 会因为依赖不满足把某些包静默踢掉。
    #    以前只打印、不阻断，于是出现「编了 4 小时、刷进去发现少插件」。
    #    这里改成硬失败：列出没启用的项，10 秒内中止。
    #    必须独立成 step —— 上一步带 continue-on-error: true，放在里面不会中断。
    # ----------------------------------------------------------------------
    - name: 严格校验插件清单（make defconfig 之后）
      run: |
        cd openwrt
        if [ ! -f .config ]; then
          echo "::error::找不到 openwrt/.config，make defconfig 未成功执行"
          exit 1
        fi
        python3 "$GITHUB_WORKSPACE/$GEN_CONFIG" \
          --plugins "$GITHUB_WORKSPACE/$PLUGINS_CFG" \
          --verify .config \
          --verify-strict \
          --verify-ignore "$GITHUB_WORKSPACE/$VERIFY_IGNORE"

    - name: 编译固件
      id: compile
      run: |
        cd openwrt
        # 新增：清理旧编译缓存，释放磁盘空间
        rm -rf build_dir staging_dir tmp
        make clean
        echo -e "$(nproc) thread compile"
        # ------------------------------------------------------------------
        # 失败重试改为「并行补跑一轮」，不再退到 -j1 串行全量重编（2026.11.06）
        #   build_dir 里已编好的包不会重编，第二轮只补失败的那几个（几分钟）；
        #   而 -j1 全量重编在这套配置下远超 8 小时，等于必然撞 6h 上限，
        #   原来「-j8 失败后退 -j1 再重来」的写法就是二次超时陷阱。
        # ------------------------------------------------------------------
        set +e
        make -j$(nproc)
        rc=$?
        if [ $rc -ne 0 ]; then
          echo "::warning::并行编译失败（rc=$rc），补跑一轮，失败包会打印详细日志"
          make -j$(nproc) V=s
          rc=$?
        fi
        set -e
        if [ $rc -ne 0 ]; then
          echo "::error::编译失败，退出码 $rc，请查看上方 V=s 段落的第一个 Error"
          exit $rc
        fi
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
        echo "DATE_YMD=_$(date +"%Y%m%d")" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 整理固件文件夹
      id: organize
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        cd $GITHUB_WORKSPACE/openwrt/bin/packages
        # ===注释下面2行，不再打包AllPackages.tar.gz===
        # tar -zcvf AllPackages.tar.gz ./*
        # cp AllPackages.tar.gz $GITHUB_WORKSPACE/openwrt/bin/targets/*/*
        cd $GITHUB_WORKSPACE/openwrt/bin/targets/*/*
        # 下面增加 AllPackages.tar.gz 兜底删除
        rm -rf packages AllPackages.tar.gz sha256sums feeds.buildinfo openwrt-armvirt-64-default.manifest openwrt-armvirt-64-Image openwrt-armvirt-64-rootfs-ext4.img version.buildinfo openwrt-armvirt-64-generic-initramfs-kernel.bin openwrt-armvirt-64-generic-kernel.bin openwrt-armvirt-64-generic.manifest profiles.json
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 再次检查服务器性能
      run: |
        echo "警告⚠"
        echo "若分配的服务器性能不足，务必及时取消，重新运行！"
        echo "已知编译成功CPU型号：8370C,8171M"
        echo "已知性能不足CPU型号：8272CL"
        echo -e "-------------- ------------CPU信息------------------------------------------\n"
        echo "CPU物理数量:$(cat /proc/cpuinfo| grep "physical id"| sort| uniq| wc -l)"
        echo -e "CPU核心及版本信息：$(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c) \n"
        echo "-------------------------------内存信息-------------------------------------------"
        echo "已安装内存详细信息："
        sudo lshw -short -C memory | grep GiB
        echo -e "\n"
        echo "-----------------------------硬盘信息---------------------------------------------"
        echo -e  "硬盘数量：$(ls /dev/sd* | grep -v [1-9] | wc -l) \n"
        echo "硬盘详情："
        df -Th

    - name: 上传配置报告
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: config-report-${{ matrix.device }}
        path: config-report-${{ matrix.device }}.txt
        if-no-files-found: ignore

    - name: 固件发布信息
      id: release
      # 钉 SHA（2026-11-13）：v1 标签在 2026-11-13 时指向的提交。
      #   注意 ncipollo/release-action 的 v1 是浮动标签，钉死后不会自动获得安全修复；
      #   需要新特性时手动查 /repos/ncipollo/release-action/git/ref/tags/v1 的 object.sha。
      uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd
      with:
        # 中间产物：标记为预发布，这样 Releases 页面会把它折叠到 Pre-releases 区，
        # 正式固件（Flippy 打包产出的 Lede2512-*-日期时间）排在前面。
        name: ${{ matrix.tag }}（编译中间产物 rootfs，供 Flippy 打包）
        prerelease: true
        allowUpdates: true
        tag: ${{ matrix.tag }}
        token: ${{ secrets.RELEASES_TOKEN }}
        body: |
          编译 Lede 25.12 固件 rootfs，供 Flippy 打包使用！
          **设备**：${{ matrix.label }}
          **编译参数**：CONFIG_TARGET_OPTIMIZATION="${{ matrix.opt }}"
          **晶晨宝盒 Releases 关键字**：${{ matrix.aml }}
          当前使用版本:【编译前的最后一次[➦主源码](https://github.com/coolsnowwolf/lede)更新记录】
          ${{ env.useVersionInfo }}
        artifacts: ${{ env.FIRMWARE }}/*

    - name: 电报机器人信息通知
      # 没配置 TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID 时这一步必然失败，
      # 用 continue-on-error 保证不影响编译结果的判定（电报通知是可选项）。
      continue-on-error: true
      if: steps.organize.outputs.status == 'success' && !cancelled()
      run: curl -k --data chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" --data "text=${{ matrix.tag }}（${{ matrix.label }}）编译完成" "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage"
