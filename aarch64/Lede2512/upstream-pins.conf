# 1) gettext host 编译失败：上游 bed88351（2026-11-13 06:44 UTC，restore native
#    macOS cross-compilation）把 tools/gnulib 升到 stable-202507，coreutils 9.6、
#    elfutils 0.196，导致 gettext-0.22.5 的 host autogen 调新版 gnulib-tool 时
#    lib/exitfail.h 补丁打不上 → ERROR: package/libs/gettext-full [host] failed
gettext-host-gnulib | tools/gnulib | bed88351 | aarch64/Lede2512/2512diy-part1.sh 的 ">>> TMP-PIN 开始" ~ "<<< TMP-PIN 结束" 标记区（回退 tools/gnulib、tools/coreutils、tools/elfutils 到 80122fea） | 删掉 part1 的 TMP-PIN 整段（含两行标记）→ 推送 → 编一次；gettext host 能过就永久去掉，仍报 exitfail.h 打不上就把该段加回，并把基准提交改成上游当前值

# gettext 本体也一起盯着：上游若把 gettext 升到补丁匹配的版本，同样算修复
gettext-version | package/libs/gettext-full | 63fe018a | 同上（part1 的 TMP-PIN 标记区） | 与上一条一起判断：任一条显示"上游已改动"即可试删 TMP-PIN

