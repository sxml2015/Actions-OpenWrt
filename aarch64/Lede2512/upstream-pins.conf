# ==============================================================================
# 上游修补登记表（Upstream Workaround Registry）
# ------------------------------------------------------------------------------
# 用途：只要为了「绕过上游某次改动」在项目里打了钉子 —— 回退某个目录到旧提交、
#       sed 改上游脚本、覆盖上游 Makefile、临时加个 patch —— 就在这里登记一行。
#
# 登记后，每次编译都会自动检查上游有没有再动过那个位置，并直接打印
# 「上游未改动 / 上游已改动」的结论，以及「修好后怎么撤」。不需要记日期、
# 不需要记哈希、不需要回头翻对话记录。
#
# 自检脚本：aarch64/scripts/check_upstream.sh
# 调用位置：.github/workflows/Lede2512_FOL.yml 的「上游修补自检」步骤
# 特性：只提示，永远不阻断编译（该步骤 continue-on-error: true）
#
# ------------------------------------------------------------------------------
# 格式（一行一条，字段用半角 | 分隔，前后空格可留可不留）：
#
#   名字 | 监测路径 | 当时基准提交 | 修补位置 | 修好后怎么处理
#
#   · 名字        短标识，英文/数字/短横线，日志里用来区分，例如 gettext-host-gnulib
#   · 监测路径    上游 coolsnowwolf/lede 仓库里的路径（文件或目录），例如 tools/gnulib
#   · 当时基准提交 打钉那一刻该路径所在的提交，7~40 位都行（按前缀比对）
#                取法：出错那次编译日志里 clone 到的 commit，或
#                https://github.com/coolsnowwolf/lede/commits/master/<路径> 的当前值
#   · 修补位置    本仓库里打钉的文件 + 便于搜索的标记（写清楚，将来靠它找）
#   · 修好后怎么处理 一句话写清操作，将来照着做；写文件路径和要删的标记名
#
# ------------------------------------------------------------------------------
# 判定规则（脚本自动执行，不用人算）：
#   监测路径的最新提交 == 基准提交  ->  上游未改动，钉子必须保留，本次不用做事
#   监测路径的最新提交 != 基准提交  ->  上游动过了，可能已修复，按「修好后怎么处理」试删
#
# 注意：这条规则故意偏保守 —— 上游改动不等于一定修好了。所以提示语是
#       「可能已修复，值得试一次」，而不是「已修复」。试删后编一次，报错完全相同
#       就把钉子加回去，并在「当时基准提交」一栏更新为新的上游提交。
# ==============================================================================

