# ======================================================================================
#  Lede2512 插件清单  plugins.cfg
# --------------------------------------------------------------------------------------
#  【怎么用】改完直接提交到 GitHub，再运行 Actions →「编译Lede2512_FOL」即可，无需本地环境。
#    1) 行首 on   → 编译进固件     （config 里没有会自动补上代码）
#    2) 行首 off  → 不编译该插件     （自动写入 "# CONFIG_xxx is not set"）
#    3) 行首 skip → 脚本不干预       （保持基线 config 原值）
#       基线里是 CONFIG_xxx=m（只编成 ipk、不装进固件）的项，默认就是 skip；
#       想把它装进固件，把 skip 改成 on 即可。
#    4) 新增插件：在文件最末尾「自定义追加区」按 <on|off> <包名或 CONFIG 名> 加一行
#       例： on   luci-app-xxx        → 自动变成 CONFIG_PACKAGE_luci-app-xxx=y
#           on   CONFIG_PACKAGE_yyy  → 原样使用
#       同一个条目写多次时，以「后面那一行」为准，所以追加区可以覆盖上面的分组开关。
#    5) "#" 开头的是注释；行尾 "#" 后面是说明，随便改
#
#  【依赖保护】某个 off 的项如果被某个 on 的插件依赖（OpenWrt 的 select 依赖），
#     make defconfig 会自动把它重新打开，编译日志里会打印「已自动保留」——
#     这就是「依赖有关联其他功能需要就不能禁」的实现，不会把固件搞坏。
#
#  【重建】本文件可用 aarch64/scripts/build_plugins_cfg.py 从字典 + .config 重新生成。
#     · 一键重建：GitHub → Actions →「重建插件清单」→ Run workflow
#     · 有 python 的电脑：python3 aarch64/scripts/build_plugins_cfg.py （不带参数即可）
#     初始 on/off = 生成时 .config 的真实状态：共 93 组 / 544 项，当前 on 80 项。
# ======================================================================================

# --------------------------------------------------------------------------------------
#  [1/93] 目前在用（必需）   （5 项，当前 on: 3，=m 保持原样: 2）
#     这一组是「目前在用需要的插件」里、字典没收录但必须保留的项。
#     带 skip 的是基线里的 =m（只编成 ipk，不装进固件）——想装进固件就改成 on。
# --------------------------------------------------------------------------------------
on    CONFIG_PACKAGE_ipset                                           # ipset
on    CONFIG_PACKAGE_iptables-mod-extra                              # iptables-mod-extra
on    CONFIG_PACKAGE_iptables-mod-tproxy                             # iptables-mod-tproxy
skip  CONFIG_PACKAGE_luci-app-cpe                                    # cpe
skip  CONFIG_PACKAGE_luci-i18n-cpe-zh-cn                             # cpe-zh-cn

# --------------------------------------------------------------------------------------
