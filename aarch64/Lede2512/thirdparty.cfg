# ==============================================================================
#  thirdparty.cfg —— Lede2512 第三方插件源清单
#  ----------------------------------------------------------------------------
#  【两种作用】
#    A. 控制 aarch64/Lede2512/2512diy-part2.sh 里已有的「内置克隆块」——不用就关掉，
#       能明显缩短编译时间、减少失败点。
#    B. 新增第三方插件仓库——写一行，编译时自动 git clone 并复制到对应包目录。
#
#  【A 语法】  on|off  block  <名字>
#      on  block openclash      # 需要 OpenClash 就保持 on
#      off block ddns-go        # 不用 ddns-go 就改 off（不会再克隆它的源码）
#
#  【B 语法】  on|off  repo   <仓库地址>  <分支(-表示默认)>  <克隆到>  [复制映射]
#      · 只写 3 个字段 → 整个仓库就是一个包目录，直接放在 <克隆到>
#      · 复制映射写法： 源子目录:目标包目录，多个用英文逗号分隔
#      · 给了复制映射 → 克隆目录视为临时目录，复制完自动删除
#      例： on repo https://github.com/xxx/luci-app-yyy.git master package/yyy luci-app-yyy:luci-app-yyy
#
#  【C 特殊处理】有些第三方插件需要编译工具、打补丁、改文件：
#      写进同目录的 thirdparty.sh，clone_thirdparty.sh 会在克隆完成后自动执行它。
#
#  【注意】这里只负责「把源码放进源码树」。某个插件要不要编译进固件，
#      由 plugins.cfg 里的 on/off 决定（两边都关掉最省时间，只关 plugins.cfg 也够了）。
# ==============================================================================


# ------------------------------------------------------------------------------
# A. 内置克隆块开关（对应 2512diy-part2.sh 里的块）
# ------------------------------------------------------------------------------
on  block smartdns           # SmartDNS 核心(pymumu) + LuCI 界面(lede 分支)
on  block kenzok8-small      # brook / ssocks / pdnsd-alt / trojan-go / dns2tcp
on  block helloworld         # xray-core / shadowsocks-rust / v2ray-* / trojan / shadow-tls 等
on  block passwall-packages  # simple-obfs / chinadns-ng / tcping / trojan-plus / hysteria / sing-box 等
on  block passwall           # luci-app-passwall
on  block passwall2          # luci-app-passwall2
on  block lua-maxminddb      # Passwall 解析库
on  block amlogic            # 晶晨宝盒 luci-app-amlogic（电视盒子必用）
off  block mosdns             # sbwml/luci-app-mosdns（v5-lua 分支）
on  block ddns-go            # sirpdboy/luci-app-ddns-go（lua 分支）
on  block openclash          # vernesong/OpenClash（含 po2lmo 编译）
# vim：老版本遗留的兼容处理，用的是 openwrt/packages 的 openwrt-18.06 分支。
#      25.12 源码下一般不再需要，编译若报 vim 相关错误就先关掉它再试。
on  block vim                # 用 openwrt-18.06 的 vim 替换出错的新版 vim


# ------------------------------------------------------------------------------
# B. 新增第三方插件仓库（示例已注释，需要时把行首的 "#" 去掉或照着写）
# ------------------------------------------------------------------------------
# on  repo https://github.com/vernesong/OpenClash.git master package/luci-app-openclash luci-app-openclash:luci-app-openclash
# on  repo https://github.com/sirpdboy/luci-app-lucky.git main package/lucky lucky:lucky
# on  repo https://github.com/jerrykuku/luci-theme-argon.git master package/luci-theme-argon luci-theme-argon:luci-theme-argon
#
# 整个仓库就是一个包目录时（最常见）：
# on  repo https://github.com/xxx/yyy.git - package/yyy
