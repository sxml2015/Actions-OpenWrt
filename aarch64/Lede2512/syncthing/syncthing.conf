config syncthing 'syncthing'
	option enabled '1'

	# Web 管理界面。只用于局域网访问，路由器 wan 区默认 REJECT，
	# 不要把 8586 映射到公网。
	option gui_address 'http://0.0.0.0:8586'

	# 配置与证书目录，必须落在外接盘的挂载点上。
	# init 脚本开机会校验这个挂载点：未挂载就拒绝启动，
	# 避免在 rootfs 里凭空建 home、生成新证书（Device ID 漂移）。
	option home '/mnt/sda1/Syncthing'

	# 后台同步，给个低优先级；改这里需要 stop/start，reload 不生效。
	option nice '19'

	# 以 root 运行：外接盘多為 exFAT/NTFS，走普通用户会有权限问题。
	option user 'root'
	option group 'root'

	# 不要添加 option _no_default_folder —— 那是 v1 的开关，
	# v2.0.0 已删除该参数，init 也不认它。
